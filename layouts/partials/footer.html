    </main>
  </div>
  <footer>
    <div class="footer-wrapper">
      <p>{{ .Site.Copyright}}</p>
      <p>Powered by <a href="https://gohugo.io/" target="_blank" rel="external">Hugo</a> and the <a href="https://github.com/jatkinson1000/personal-web" target='_blank' rel="external">Personal Web</a> theme, this site uses the <a href="https://www.brailleinstitute.org/freefont/" target="_blank" rel="external">Atkinson Hyperlegible</a> font.</p>
    </div>
  </footer>
  {{ template "_internal/google_analytics.html" . }}

  <script type="text/javascript">
    var mobileHeader = document.querySelector('.mobile-header');
    if (mobileHeader) {
      mobileHeader.addEventListener('click', function () {
        var om = document.querySelector(".overlay-menu");
        var hamburger = document.querySelector('.hamburger');
        var isOpen = hamburger.classList.contains("cross");
        if (isOpen) {
          hamburger.classList.remove("cross");
          hamburger.setAttribute("aria-expanded", "false");
          om.style.display = "none";
          om.style.width = "0%";
          om.style.height = "0%";
        }
        else {
          hamburger.classList.add("cross");
          hamburger.setAttribute("aria-expanded", "true");
          om.style.width = "100%";
          om.style.height = "100vh";
          om.style.display = "block";
        }
      });
    }
  </script>
  {{ if $.Site.Params.copyCodeButtonEnabled }}
    {{ if (findRE "<pre" .Content 1) }}
      <script src="/js/copy-code-button.js"></script>
    {{ end }}
  {{ end }}
</body>
</html>
